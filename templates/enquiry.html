{% extends "master.html" %}
{% load static %}
{% load crispy_forms_tags %}


{% block title %}
    Alfalasi - Enquiry
{% endblock title %}


{% block content %}
    
    <!-- Page Title -->
    <div class="page-title" data-aos="fade">
      <nav class="breadcrumbs">
        <div class="container">
          <ol>
            <li><a href="/">Home</a></li>
            <li class="current"><a href="/enquiry/">Send Your Enquiry</a></li>
          </ol>
        </div>
      </nav>
    </div>
    <!-- End Page Title -->

    

    <!-- Enquiry Form Start -->
    
    <div>
      <h2 class="text-center mt-5">Enquiry Form</h2>
    </div>
    <div class="container mt-5 mb-5 border p-4 rounded shadow-lg">
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid gap-2 col-6 mx-auto mt-3">
                <button type="submit" class="btn btn-lg btn-primary" type="button">Submit</button>
            </div>
        </form>
    </div>
    <!-- Enquiry Form End -->


{% endblock content %}
